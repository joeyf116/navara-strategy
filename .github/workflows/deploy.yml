name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: "Skip Terraform (infra already up-to-date)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.8.5"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  DATABASE_URL_SECRET_ID: navara-sftp/database-url
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
  APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
  COGNITO_CALLBACK_URLS: ${{ vars.COGNITO_CALLBACK_URLS }}
  COGNITO_LOGOUT_URLS: ${{ vars.COGNITO_LOGOUT_URLS }}

permissions:
  id-token: write # required for OIDC token exchange
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXTAUTH_SECRET: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_uri: ${{ steps.build.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Bootstrap ECR
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app \
            -var="app_image_identifier=public.ecr.aws/docker/library/node:22-alpine" \
            -var="transfer_user_public_key=${{ secrets.SFTP_USER_PUBLIC_KEY }}" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}"

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        id: build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHA_SHORT}"
          LATEST="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"
          docker build \
            -f Dockerfile.lambda \
            --tag "${URI}" \
            --tag "${LATEST}" \
            --cache-from "${LATEST}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          docker push "${URI}"
          docker push "${LATEST}"

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_terraform != 'true' }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Reconcile pre-existing migration resources
        env:
          TF_VAR_app_image_identifier: ${{ needs.build-push.outputs.image_uri }}
          TF_VAR_transfer_user_public_key: ${{ secrets.SFTP_USER_PUBLIC_KEY }}
          TF_VAR_cognito_domain: ${{ env.COGNITO_DOMAIN }}
          TF_VAR_cognito_callback_urls: ${{ env.COGNITO_CALLBACK_URLS }}
          TF_VAR_cognito_logout_urls: ${{ env.COGNITO_LOGOUT_URLS }}
          TF_VAR_app_public_url: ${{ env.APP_PUBLIC_URL }}
        run: |
          ROLE="${{ env.ECR_REPOSITORY }}-codebuild-migrate"
          PROJECT="navara-sftp-db-migrate"

          # Import each resource only if absent from state but present in AWS.
          if ! terraform state list | grep -qx 'aws_iam_role.codebuild_migrate'; then
            aws iam get-role --role-name "$ROLE" >/dev/null 2>&1 && \
              terraform import -input=false aws_iam_role.codebuild_migrate "$ROLE" || true
          fi

          if ! terraform state list | grep -qx 'aws_iam_role_policy.codebuild_migrate'; then
            aws iam get-role-policy --role-name "$ROLE" --policy-name "${ROLE}-policy" >/dev/null 2>&1 && \
              terraform import -input=false aws_iam_role_policy.codebuild_migrate "${ROLE}:${ROLE}-policy" || true
          fi

          if ! terraform state list | grep -qx 'aws_codebuild_project.db_migrate'; then
            COUNT=$(aws codebuild batch-get-projects --names "$PROJECT" --query 'length(projects)' --output text)
            [ "$COUNT" = "1" ] && \
              terraform import -input=false aws_codebuild_project.db_migrate "$PROJECT" || true
          fi

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -var="app_image_identifier=${{ needs.build-push.outputs.image_uri }}" \
            -var="transfer_user_public_key=${{ secrets.SFTP_USER_PUBLIC_KEY }}" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}" \
            -out=tfplan \
            -detailed-exitcode
          EXIT_CODE=$?
          set -e

          echo "exitcode=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          [ "$EXIT_CODE" -eq 1 ] && exit 1 || true

      - name: Terraform Apply
        if: ${{ steps.plan.outputs.has_changes == 'true' }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Show App URL
        run: terraform output app_url

  prisma-migrate:
    name: Prisma Migrate (CodeBuild)
    runs-on: ubuntu-latest
    needs: [build-push, terraform]
    if: ${{ always() && needs.build-push.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start migration build in VPC
        id: start_build
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name "navara-sftp-db-migrate" \
            --environment-variables-override \
              name=REPO_SHA,value="${GITHUB_SHA}",type=PLAINTEXT \
              name=REPO_URL,value="https://github.com/${{ github.repository }}.git",type=PLAINTEXT \
              name=DATABASE_URL_SECRET_ID,value="${{ env.DATABASE_URL_SECRET_ID }}",type=PLAINTEXT \
              name=AWS_REGION,value="${{ env.AWS_REGION }}",type=PLAINTEXT \
            --query 'build.id' \
            --output text)
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Started migration build: ${BUILD_ID}"

      - name: Wait for migration build
        run: |
          BUILD_ID="${{ steps.start_build.outputs.build_id }}"
          MAX_ATTEMPTS=120
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)

            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: ${STATUS}"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Migration completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "FAULT" ] || [ "$STATUS" = "TIMED_OUT" ] || [ "$STATUS" = "STOPPED" ]; then
              aws codebuild batch-get-builds \
                --ids "$BUILD_ID" \
                --query 'builds[0].{status:buildStatus,currentPhase:currentPhase,phases:phases[*].[phaseType,phaseStatus,contexts]}' \
                --output json
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done

          echo "Migration build timed out while waiting for completion."
          exit 1
