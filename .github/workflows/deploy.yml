name: Manual Deploy

# Deployment is MANUAL ONLY. Nothing deploys on push, pull request, merge, or
# tag. To deploy: GitHub → Actions → "Manual Deploy" → Run workflow, then pick
# the environment and action. CI checks for pushes/PRs live in ci.yml and never
# deploy. Configure a GitHub Environment named "production" with required
# reviewers to add an approval gate before any AWS credentials are issued.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - production
      action:
        description: "Terraform action (plan = preview only, no changes applied)"
        required: true
        type: choice
        options:
          - plan
          - apply
      deploy_frontend:
        description: "Build & push the app container image"
        required: true
        type: boolean
        default: true
      deploy_infrastructure:
        description: "Run Terraform (plan/apply infrastructure)"
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.8.5"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  # Scope the deploy role's least-privilege policy to the state bucket/lock
  # table (see terraform/deploy.tf). TF_VAR_* applies to every terraform run.
  TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_tf_lock_table: ${{ vars.TF_LOCK_TABLE }}
  COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
  APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
  COGNITO_CALLBACK_URLS: ${{ vars.COGNITO_CALLBACK_URLS }}
  COGNITO_LOGOUT_URLS: ${{ vars.COGNITO_LOGOUT_URLS }}

permissions:
  id-token: write # required for OIDC token exchange
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show deployment selection
        run: |
          {
            echo "## Deployment selection"
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Action: \`${{ inputs.action }}\`"
            echo "- Build & push image: \`${{ inputs.deploy_frontend }}\`"
            echo "- Run Terraform: \`${{ inputs.deploy_infrastructure }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ inputs.deploy_frontend }}
    environment: ${{ inputs.environment }}
    outputs:
      image_uri: ${{ steps.build.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Bootstrap ECR
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app \
            -var="app_image_identifier=public.ecr.aws/docker/library/node:22-alpine" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}"

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        id: build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHA_SHORT}"
          LATEST="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"
          docker build \
            -f Dockerfile.lambda \
            --tag "${URI}" \
            --tag "${LATEST}" \
            --cache-from "${LATEST}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          docker push "${URI}"
          docker push "${LATEST}"

      # When infrastructure is not being deployed, Terraform won't roll the
      # Lambda to the new image — update the function code directly so a
      # frontend-only apply still ships the new build.
      - name: Update Lambda image (frontend-only deploy)
        if: ${{ !inputs.deploy_infrastructure && inputs.action == 'apply' }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.ECR_REPOSITORY }}-web" \
            --image-uri "${{ steps.build.outputs.uri }}" \
            --publish
          echo "Lambda updated to ${{ steps.build.outputs.uri }}" >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    needs: build-push
    # Run whenever infrastructure deployment is selected, even if the image
    # build job was skipped (deploy_frontend = false).
    if: ${{ always() && inputs.deploy_infrastructure && needs.build-push.result != 'failure' && needs.build-push.result != 'cancelled' }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Resolve image URI
        id: image
        run: |
          if [ -n "${{ needs.build-push.outputs.image_uri }}" ]; then
            URI="${{ needs.build-push.outputs.image_uri }}"
          else
            # Image build skipped — keep the currently deployed image.
            URI=$(aws lambda get-function \
              --function-name "${{ env.ECR_REPOSITORY }}-web" \
              --query 'Code.ImageUri' --output text)
          fi
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${URI}"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Import pre-existing secrets (idempotent)
        run: |
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "navara-sftp/database-url" \
            --query 'ARN' --output text 2>/dev/null || echo "")
          if [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ]; then
            terraform import \
              -input=false \
              -var="app_image_identifier=${{ steps.image.outputs.uri }}" \
              -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
              -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
              -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
              -var="app_public_url=${{ env.APP_PUBLIC_URL }}" \
              aws_secretsmanager_secret.db_url "$SECRET_ARN" || true
          fi

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -var="app_image_identifier=${{ steps.image.outputs.uri }}" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}" \
            -out=tfplan \
            -detailed-exitcode | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exitcode=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Terraform plan (${{ inputs.environment }})"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$EXIT_CODE" -eq 1 ] && exit 1 || true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_number }}
          path: |
            terraform/tfplan
            terraform/plan.txt
          retention-days: 14

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' && steps.plan.outputs.has_changes == 'true' }}
        run: terraform apply -input=false tfplan

      - name: Show App URL
        if: ${{ inputs.action == 'apply' }}
        run: terraform output app_url
