name: CI

# Validation only — this workflow never deploys and uses no AWS credentials.
# Deployment is manual-only via the "Manual Deploy" workflow (deploy.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.8.5"

jobs:
  ci:
    name: Lint · Type Check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXTAUTH_SECRET: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000

  terraform-checks:
    name: Terraform fmt · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform validate (no backend)
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
