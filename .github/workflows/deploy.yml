name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: "Skip Terraform (infra already up-to-date)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.8.5"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  DATABASE_URL_SECRET_ID: ${{ vars.DATABASE_URL_SECRET_ID || 'navara-sftp/database-url' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
  APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
  COGNITO_CALLBACK_URLS: ${{ vars.COGNITO_CALLBACK_URLS }}
  COGNITO_LOGOUT_URLS: ${{ vars.COGNITO_LOGOUT_URLS }}

permissions:
  id-token: write # required for OIDC token exchange
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000

  terraform-bootstrap:
    name: Terraform Bootstrap
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Bootstrap ECR
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app \
            -var="app_image_identifier=public.ecr.aws/docker/library/node:22-alpine" \
            -var="transfer_user_public_key=${{ secrets.SFTP_USER_PUBLIC_KEY }}" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}"

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: terraform-bootstrap
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "uri=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.lambda \
            --tag "${{ steps.image.outputs.uri }}" \
            --tag "${{ steps.image.outputs.latest }}" \
            --cache-from "${{ steps.image.outputs.latest }}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
        env:
          DOCKER_BUILDKIT: 1

      - name: Push image to ECR
        run: |
          docker push "${{ steps.image.outputs.uri }}"
          docker push "${{ steps.image.outputs.latest }}"

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_terraform != 'true' }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var="app_image_identifier=${{ needs.build-push.outputs.image_uri }}" \
            -var="transfer_user_public_key=${{ secrets.SFTP_USER_PUBLIC_KEY }}" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}" \
            -out=tfplan \
            -detailed-exitcode
          EXIT_CODE=$?
          echo "exitcode=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve -input=false tfplan

      - name: Show App URL
        if: steps.plan.outputs.exitcode == '2'
        run: |
          terraform output app_url

  prisma-migrate:
    name: Prisma Migrate
    runs-on: ubuntu-latest
    needs: [build-push, terraform]
    if: ${{ always() && needs.build-push.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load DATABASE_URL from Secrets Manager
        run: |
          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "${{ env.DATABASE_URL_SECRET_ID }}" \
            --query SecretString \
            --output text)
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is empty or missing"
            exit 1
          fi
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
