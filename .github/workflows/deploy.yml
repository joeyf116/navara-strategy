name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: "Skip Terraform (infra already up-to-date)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.8.5"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
  APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
  COGNITO_CALLBACK_URLS: ${{ vars.COGNITO_CALLBACK_URLS }}
  COGNITO_LOGOUT_URLS: ${{ vars.COGNITO_LOGOUT_URLS }}

permissions:
  id-token: write # required for OIDC token exchange
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_uri: ${{ steps.build.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Bootstrap ECR
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app \
            -var="app_image_identifier=public.ecr.aws/docker/library/node:22-alpine" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}"

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        id: build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHA_SHORT}"
          LATEST="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"
          docker build \
            -f Dockerfile.lambda \
            --tag "${URI}" \
            --tag "${LATEST}" \
            --cache-from "${LATEST}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          docker push "${URI}"
          docker push "${LATEST}"

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_terraform != 'true' }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -var="app_image_identifier=${{ needs.build-push.outputs.image_uri }}" \
            -var="cognito_domain=${{ env.COGNITO_DOMAIN }}" \
            -var='cognito_callback_urls=${{ env.COGNITO_CALLBACK_URLS }}' \
            -var='cognito_logout_urls=${{ env.COGNITO_LOGOUT_URLS }}' \
            -var="app_public_url=${{ env.APP_PUBLIC_URL }}" \
            -out=tfplan \
            -detailed-exitcode
          EXIT_CODE=$?
          set -e

          echo "exitcode=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          [ "$EXIT_CODE" -eq 1 ] && exit 1 || true

      - name: Terraform Apply
        if: ${{ steps.plan.outputs.has_changes == 'true' }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Show App URL
        run: terraform output app_url
